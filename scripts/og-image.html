<!doctype html>
<!-- Link-preview card (1200×630). Rendered to public/og.png by scripts/og-image.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&family=Newsreader:ital,opsz,wght@1,6..72,400&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #0a0a0a; }
  body { font-family: Geist, sans-serif; display: grid; grid-template-columns: 1fr 360px; }
  main { padding: 56px 56px 48px; display: flex; flex-direction: column; border-right: 1px solid #dcdcd7; }
  .lbl { font: 400 15px/1.4 'Geist Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
  .top { display: flex; gap: 40px; }
  .top span:not(:first-child) { color: #6e6e6a; }
  h1 { margin-top: auto; font-weight: 500; font-size: 66px; line-height: 1.04; letter-spacing: -0.04em; }
  h1 em { font: italic 400 1.08em/1 Newsreader, serif; letter-spacing: -0.02em; color: #0b6e4f; }
  .rule { height: 1px; background: #dcdcd7; margin: 40px 0 22px; }
  .bottom { display: flex; justify-content: space-between; color: #3f3f3d; }
  .bottom b { font-weight: 400; color: #0b6e4f; }
  aside { background: #f2f2ef url('../public/img/portrait.webp') center 18% / cover no-repeat; }
</style>
</head>
<body>
  <main>
    <p class="lbl top"><span>Saksham Shukla</span><span>Product designer</span><span>Hyderabad</span></p>
    <h1>I turn complex technology into products people <em>understand.</em></h1>
    <div class="rule"></div>
    <p class="lbl bottom"><span>AI · Conversational · In-car</span><span>Verizon · HARMAN</span><b>sakshamshukla.com</b></p>
  </main>
  <aside aria-label="Saksham Shukla speaking on stage"></aside>
</body>
</html>
